[project]
name = "courtedge"
version = "0.1.0"
description = "Tennis win-probability models backtested against Betfair Exchange odds (simulation only)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "polars>=1.0",
    "pyarrow>=15",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
betfair = ["betfairlightweight>=2.20"]

[dependency-groups]
dev = [
    "pybind11>=3.1.0",
    "pytest>=8",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/courtedge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: Monte Carlo checks that take more than a few seconds"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
